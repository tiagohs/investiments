<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribuições e Metas</title>

<!-- Blocinho PWA — colado em toda página HTML (item 8j do plano). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2A78D6">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/shell.css">
<!-- 16/09/2026: as duas folhas carregam nos dois arquivos de entrada
     (aqui e em index.html) — ver o mesmo comentário em index.html. -->
<link rel="stylesheet" href="assets/css/inicio.css">
<link rel="stylesheet" href="assets/css/distribuicoes-metas.css">
</head>
<body data-section="distribuicoes">

<div class="wrap">
  <div id="shell-header"></div>

  <!-- 16/09/2026: o <main> de cada aba (Início / Distribuições e Metas)
       era conteúdo fixo aqui — agora mora em assets/partials/pages.html
       e é injetado dinamicamente por assets/js/router.js (mesmo padrão
       do header/footer do shell), pra permitir trocar de aba sem
       recarregar a página. Ver router.js pro porquê. -->
  <div id="app-pages"></div>

  <div id="shell-footer"></div>
</div>

<script type="module">
  import { mountShell } from './assets/js/shell.js';
  import { mountRouter } from './assets/js/router.js';

  mountShell({
    onAuthenticated(token) {
      mountRouter(document, { token });
    },
  });
</script>
</body>
</html>
