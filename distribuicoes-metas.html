<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribuições e Metas</title>

<!-- Blocinho PWA — colado em toda página HTML (item 8j do plano). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2A78D6">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/distribuicoes-metas.css">
</head>
<body data-section="distribuicoes">

<div class="wrap">
  <div id="shell-header"></div>

  <main hidden>
    <!-- 14/09/2026: 1ª fatia foi só "Metas da Carteira". 2ª fatia (mesmo
         dia) acrescenta "Objetivos da Carteira" logo acima — ambas ligadas
         à mesma ação distribuicoesMetas (apps-script/DistribuicoesMetas.gs),
         por isso compartilham loading/erro. Radar de oportunidades
         (Ações/EUA/FIIs) entra numa próxima rodada — ver
         docs/plano-implementacao.html. Ordem das seções aqui é a ordem que
         o Tiago pediu: Objetivos → Radar (futuro) → Metas. -->

    <div class="metas-loading" id="metasLoading" aria-hidden="true">
      <span class="skel skel-header"></span>
      <div class="obj-grid">
        <span class="skel" style="height:190px"></span>
        <span class="skel" style="height:190px"></span>
      </div>
      <span class="skel skel-header" style="margin-top:8px"></span>
      <div class="goals-grid">
        <span class="skel" style="height:220px"></span>
        <span class="skel" style="height:220px"></span>
        <span class="skel" style="height:220px"></span>
      </div>
    </div>

    <div class="metas-erro" id="metasErro" hidden></div>

    <div id="metasConteudo" hidden>
      <div class="avisos-banner" id="metasAvisos" hidden></div>

      <div class="area-header">
        <h2>Objetivos da carteira</h2>
        <span class="hint">Quanto você quer ter em cada tipo de ativo — e quanto falta investir pra chegar lá</span>
      </div>
      <div id="objetivosCarteiraGrid"></div>

      <div class="area-header" style="margin-top:28px">
        <h2>Metas da carteira</h2>
        <span class="hint">Renda Passiva, Patrimônio e Renda Emergencial — clique em "Editar" em qualquer cartão pra mudar a meta direto na planilha</span>
      </div>
      <div class="goals-grid" id="metasCarteiraGrid"></div>
    </div>
  </main>

  <div id="shell-footer"></div>
</div>

<script type="module">
  import { mountShell } from './assets/js/shell.js';
  import { montarPaginaDistribuicoesMetas } from './assets/js/pages/distribuicoes-metas.js';

  mountShell({
    onAuthenticated(token) {
      montarPaginaDistribuicoesMetas(token);
    },
  });
</script>
</body>
</html>
