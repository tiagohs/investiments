<body data-section="carteiras">

<div class="wrap">
  <div id="shell-header"></div>

  <main class="cart-main at-main">

    <header id="ativoCabecalho"></header>
    <div class="cart-esq" id="ativoLoading" aria-hidden="true">
      <span class="skel at-esq-hero"></span>
      <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
      <span class="skel cart-esq-bloco"></span>
    </div>
    <div id="ativoErro" hidden></div>
    <div id="ativoConteudo" hidden></div>
  </main>

  <div id="shell-footer"></div>
</div>
<script type="module">
  import { mountShell } from '../assets/js/shell.js';
  import { montarPaginaAtivo } from '../assets/js/pages/ativo.js';
  mountShell({
    onAuthenticated(token) {
      montarPaginaAtivo(token, { doc: document });
    },
  });
</script>
