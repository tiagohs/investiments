<!--
  assets/partials/pages.html — markup for the two SPA-routed pages
  (Início / Distribuições e Metas), fetched and injected by
  assets/js/router.js — mesmo padrão de assets/partials/shell.html
  (fetch + <template>, injetado 1x só na inicialização do app).

  16/09/2026: extraído de dentro de <main> em index.html e
  distribuicoes-metas.html (que antes eram páginas HTML completas e
  independentes — cada troca de aba era uma navegação de página cheia
  do navegador, recarregando tudo, inclusive o popover de sincronização
  do header) pra permitir que o router monte as duas "abas" dentro do
  MESMO documento, trocando de uma pra outra só escondendo/mostrando
  <main> e sem nenhum fetch de dado novo depois da 1ª visita de cada
  uma (ver router.js). O <main> em si (id + hidden) é criado pelo
  próprio router.js — aqui só o conteúdo de dentro dele.

  Conteúdo idêntico ao que cada página tinha antes — nada mudou de
  fato na marcação, só o arquivo onde ela mora.
-->
<template id="page-inicio-template">

    <!-- 26/09/2026 (Tiago: "ela tem coisas muito grandes, ocupa muito
         espaço"): Início reorganizada - faixa fina de mercado (índices e
         câmbio com o gráfico do dia), Favoritos (com o gráfico do dia),
         Minha carteira num cartão só (as 4 visões viram abas-número e a
         distribuição uma barra), e embaixo 2 colunas: Rentabilidade à
         esquerda; Proventos do mês e Meus ativos (lista enxuta) na lateral.
         Ver pages/inicio-painel.js e pages/inicio-intradia.js. -->

    <div class="inicio-loading" id="inicioLoading" aria-hidden="true">
      <div class="skel-faixa"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
      <span class="skel skel-header" style="margin-top:14px"></span>
      <span class="skel" style="height:190px;border-radius:18px"></span>
      <div class="skel-colunas"><span class="skel" style="height:420px;border-radius:18px"></span><span class="skel" style="height:420px;border-radius:18px"></span></div>
    </div>

    <div class="inicio-erro" id="inicioErro" hidden></div>

    <div id="inicioConteudo" hidden>
      <div id="refreshControlInicio" class="refresh-control"></div>
      <div class="avisos-banner" id="inicioAvisos" hidden></div>

      <section class="mkt-secao" aria-label="Índices e câmbio - referência de mercado, não é dado da sua carteira">
        <div class="mkt-faixa" id="faixaMercado"></div>
      </section>

      <!-- 23/09/2026: Favoritos (assets/js/pages/inicio-favoritos.js) - cópia
           dos ativos marcados com a estrela, na ordem salva (aba
           Auxiliar_favoritos). 26/09/2026: cada cartão traz o gráfico do dia. -->
      <section class="favoritos-secao" id="favoritosSecao" hidden>
        <div class="area-header">
          <h2>Favoritos</h2>
          <button type="button" class="favoritos-editar" id="favoritosEditar" aria-pressed="false" hidden></button>
        </div>
        <p class="hint favoritos-dica" id="favoritosDica" hidden>Arraste os cards pra mudar a ordem (no teclado: setas). Toque em Concluir pra salvar, ou Esc pra desfazer.</p>
        <div class="ativos-grid favoritos-grid" id="favoritosGrid"></div>
        <div class="favoritos-status" id="favoritosStatus" role="status" aria-live="polite"></div>
      </section>

      <section class="home-carteira">
        <div class="area-header">
          <h2>Minha carteira</h2>
          <span class="personal-chip">🔒 Seus dados · aba Dash Geral</span>
        </div>
        <div id="resumoPatrimonio"></div>
      </section>

      <div class="home-colunas">
        <div class="home-principal">
          <div class="area-header">
            <h2>Rentabilidade</h2>
          </div>
          <div class="filter-tabs" id="periodoTabs" style="margin-bottom:14px">
            <button class="filter-tab active" type="button" data-periodo="mes">Mês atual</button>
            <button class="filter-tab" type="button" data-periodo="30d">30 dias</button>
            <button class="filter-tab" type="button" data-periodo="6m">6 meses</button>
            <button class="filter-tab" type="button" data-periodo="12m">12 meses</button>
            <button class="filter-tab" type="button" data-periodo="3a">3 anos</button>
            <button class="filter-tab" type="button" data-periodo="tudo">Desde o início</button>
          </div>

          <div class="rentab-grid">
            <div class="rentab-card rentab-card-full">
              <div class="rentab-card-info" id="rentabInfoTotal"></div>
              <div class="rentab-card-chart" id="rentabChartTotal"></div>
              <div class="chart-legend2" id="rentabLegendaTotal"></div>
            </div>
            <div class="rentab-card">
              <div class="rentab-card-info" id="rentabInfoLongoPrazo"></div>
              <div class="rentab-card-chart" id="rentabChartLongoPrazo"></div>
              <div class="chart-legend2" id="rentabLegendaLongoPrazo"></div>
            </div>
            <div class="rentab-card">
              <div class="rentab-card-info" id="rentabInfoNacional"></div>
              <div class="rentab-card-chart" id="rentabChartNacional"></div>
              <div class="chart-legend2" id="rentabLegendaNacional"></div>
            </div>
            <div class="rentab-card">
              <div class="rentab-card-info" id="rentabInfoInternacional"></div>
              <div class="rentab-card-chart" id="rentabChartInternacional"></div>
              <div class="chart-legend2" id="rentabLegendaInternacional"></div>
            </div>
            <div class="rentab-card">
              <div class="rentab-card-info" id="rentabInfoRendaEmergencial"></div>
              <div class="rentab-card-chart" id="rentabChartRendaEmergencial"></div>
              <div class="chart-legend2" id="rentabLegendaRendaEmergencial"></div>
            </div>
          </div>
          <p class="rentab-dica" aria-hidden="true">Deslize pro lado: Longo Prazo, Nacional, Internacional e Renda Emergencial →</p>
        </div>

        <aside class="home-lateral" aria-label="Proventos e meus ativos">
          <!-- 24/09/2026: proventos do mês (inicio-proventos.js) -->
          <section class="proventos-secao lateral-card" id="proventosSecao" hidden>
            <div class="lateral-cab">
              <h2>Proventos do mês</h2>
              <a class="lateral-link" href="proventos/index.html">Ver tudo ›</a>
            </div>
            <div class="prov-corpo"></div>
          </section>

          <section class="lateral-card al-card">
            <div class="lateral-cab">
              <h2>Meus ativos</h2>
              <span class="hint" id="alContador"></span>
            </div>
            <div class="al-ferramentas">
              <label class="al-busca"><span class="sr-only">Buscar ativo</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                <input type="search" id="alBusca" placeholder="Buscar ativo" autocomplete="off">
              </label>
              <label class="al-ordem"><span class="sr-only">Ordenar</span>
                <select id="alOrdem">
                  <option value="carteira">Carteira</option>
                  <option value="alta">Maior alta</option>
                  <option value="queda">Maior queda</option>
                  <option value="posicao">Maior posição</option>
                </select>
              </label>
            </div>
            <div class="al-abas" id="filtroAtivosTabs" role="group" aria-label="Filtrar por classe">
              <button type="button" class="al-aba active" data-classe="todos" aria-pressed="true">Todos <span class="al-n"></span></button>
              <button type="button" class="al-aba" data-classe="acoes" aria-pressed="false">Ações <span class="al-n"></span></button>
              <button type="button" class="al-aba" data-classe="fiis" aria-pressed="false">FIIs <span class="al-n"></span></button>
              <button type="button" class="al-aba" data-classe="usa" aria-pressed="false">EUA <span class="al-n"></span></button>
              <button type="button" class="al-aba" data-classe="rf" aria-pressed="false">RF <span class="al-n"></span></button>
            </div>
            <ul class="al-lista" id="meusAtivosGrid"></ul>
            <button type="button" class="al-mais" id="alMais" hidden></button>
          </section>
        </aside>
      </div>
    </div>
  </template>

<template id="page-distribuicoes-template">

    <!-- 14/09/2026: 1ª fatia foi só "Metas da Carteira". 2ª fatia (mesmo
         dia) acrescenta "Objetivos da Carteira" e a 4ª "Radar de
         oportunidades" (3ª foi só o back-end de leitura do Radar) — as 3
         seções vêm juntas na mesma ação distribuicoesMetas
         (apps-script/DistribuicoesMetas.gs), por isso compartilham
         loading/erro. Ordem das seções aqui é a ordem que o Tiago pediu:
         Objetivos → Radar → Metas. -->

    <div class="metas-loading" id="metasLoading" aria-hidden="true">
      <span class="skel skel-header"></span>
      <div class="obj-grid">
        <span class="skel" style="height:190px"></span>
        <span class="skel" style="height:190px"></span>
      </div>
      <span class="skel skel-header" style="margin-top:8px"></span>
      <span class="skel" style="height:260px"></span>
      <span class="skel skel-header" style="margin-top:8px"></span>
      <div class="goals-grid">
        <span class="skel" style="height:220px"></span>
        <span class="skel" style="height:220px"></span>
        <span class="skel" style="height:220px"></span>
      </div>
    </div>

    <div class="metas-erro" id="metasErro" hidden></div>

    <div id="metasConteudo" hidden>
      <div id="refreshControlDistribuicoes" class="refresh-control"></div>
      <div class="avisos-banner" id="metasAvisos" hidden></div>

      <div class="area-header">
        <h2>Objetivos da carteira</h2>
        <span class="hint">Quanto você quer ter em cada tipo de ativo — e quanto falta investir pra chegar lá. Clique em "Editar % desejado" em cada bloco pra mudar direto na planilha.</span>
      </div>
      <div id="objetivosCarteiraGrid"></div>

      <div class="area-header" style="margin-top:28px">
        <h2>Radar de oportunidades</h2>
        <span class="hint">Ranking de compra por classe de ativo. Clique no cabeçalho de qualquer coluna pra ordenar (default: Ranking) e em "Editar" numa linha pra mudar Ranking, Preço-teto ou % desejado direto na planilha.</span>
      </div>
      <div id="splitInternoGrid"></div>
      <div id="radarOportunidadesGrid"></div>

      <div class="area-header" style="margin-top:28px">
        <h2>Metas da carteira</h2>
        <span class="hint">Renda Passiva, Patrimônio e Renda Emergencial — clique em "Editar" em qualquer cartão pra mudar a meta direto na planilha</span>
      </div>
      <div class="goals-grid" id="metasCarteiraGrid"></div>
    </div>
  </template>
