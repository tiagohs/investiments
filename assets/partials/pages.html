<!--
  assets/partials/pages.html — markup for the two SPA-routed pages
  (Início / Distribuições e Metas), fetched and injected by
  assets/js/router.js — mesmo padrão de assets/partials/shell.html
  (fetch + <template>, injetado 1x só na inicialização do app).

  16/09/2026: extraído de dentro de <main> em index.html e
  distribuicoes-metas.html (que antes eram páginas HTML completas e
  independentes — cada troca de aba era uma navegação de página cheia
  do navegador, recarregando tudo, inclusive o popover de sincronização
  do header) pra permitir que o router monte as duas "abas" dentro do
  MESMO documento, trocando de uma pra outra só escondendo/mostrando
  <main> e sem nenhum fetch de dado novo depois da 1ª visita de cada
  uma (ver router.js). O <main> em si (id + hidden) é criado pelo
  próprio router.js — aqui só o conteúdo de dentro dele.

  Conteúdo idêntico ao que cada página tinha antes — nada mudou de
  fato na marcação, só o arquivo onde ela mora.
-->
<template id="page-inicio-template">

    <!-- 06/10/2026 (Onda 3, kit Material 3): cabeçalho padrão (título + "Atualizar dados"), faixa de mercado, Favoritos,
         4 cartões KPI do patrimônio (1 por visão, com sparkline), e embaixo a grade principal + coluna lateral:
         Rentabilidade (gráficos da biblioteca, período segmentado) à esquerda; Distribuição (anel), Proventos do mês e
         Meus ativos (lista-resumo) na lateral. Histórico: 26/09/2026 reorganizou a tela pra ocupar menos espaço.
         Ver pages/inicio.js, inicio-painel.js e inicio-intradia.js. -->

    <div id="inicioCabecalho"></div>

    <div class="inicio-loading" id="inicioLoading" aria-hidden="true">
      <div class="skel-faixa"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
      <div class="grid-kpi"><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span></div>
      <div class="skel-colunas"><span class="skel skel-bloco"></span><span class="skel skel-bloco"></span></div>
    </div>

    <div class="inicio-erro" id="inicioErro" hidden></div>

    <div id="inicioConteudo" hidden>
      <div class="avisos-banner" id="inicioAvisos" hidden role="status"></div>

      <section class="mkt-secao" aria-label="Índices e câmbio (referência de mercado, não é dado da sua carteira)">
        <div class="mkt-faixa" id="faixaMercado"></div>
      </section>

      <!-- 07/10/2026: hero "Patrimônio líquido" (inicio-hero.js; dado do getPatrimonio, buscado em paralelo DEPOIS do 1º desenho
           - ver inicio-blocos.js). O esqueleto abaixo vale até o JS trocar o conteúdo. No celular vem logo depois dos índices. -->
      <section class="card hero-pl inicio-secao" id="patrimonioHero" aria-label="Patrimônio líquido" data-estado="carregando">
        <div class="hero-esqueleto" aria-hidden="true"><span class="skel skel-linha hero-esq-a"></span><span class="skel skel-linha hero-esq-b"></span><span class="skel skel-bloco hero-esq-c"></span></div>
      </section>

      <!-- 23/09/2026: Favoritos (assets/js/pages/inicio-favoritos.js) - cópia dos ativos marcados com a estrela, na ordem
           salva (aba Auxiliar_favoritos). 26/09/2026: cada cartão traz o gráfico do dia. -->
      <section class="favoritos-secao inicio-secao" id="favoritosSecao" hidden>
        <div class="secao-cab">
          <h2 class="secao-titulo">Favoritos</h2>
          <button type="button" class="favoritos-editar btn btn-text btn-sm" id="favoritosEditar" aria-pressed="false" hidden></button>
        </div>
        <p class="hint favoritos-dica" id="favoritosDica" hidden>Arraste os cards pra mudar a ordem (no teclado: setas). Toque em Concluir pra salvar, ou Esc pra desfazer.</p>
        <div class="ativos-grid favoritos-grid" id="favoritosGrid"></div>
        <div class="favoritos-status" id="favoritosStatus" role="status" aria-live="polite"></div>
      </section>

      <div class="pagina-grid com-lateral home-colunas">
        <div class="home-principal">
          <div class="secao-cab rentab-cab">
            <h2 class="secao-titulo">Rentabilidade dos investimentos</h2>
            <div class="rentab-periodo" id="periodoTabs"></div>
          </div>

          <div class="rentab-grid">
            <div class="card rentab-card rentab-card-full">
              <div class="rentab-card-info" id="rentabInfoTotal"></div>
              <div class="rentab-card-chart" id="rentabChartTotal"></div>
              <div id="rentabLegendaTotal"></div>
            </div>
            <details class="rentab-mais" id="rentabMais" open>
              <summary><span>Por visão</span><small>Longo Prazo, Nacional, Internacional e Renda Emergencial</small><svg class="ico" aria-hidden="true"><use href="#ico-expand-more"/></svg></summary>
              <div class="rentab-subgrid">
                <div class="card rentab-card">
                  <div class="rentab-card-info" id="rentabInfoLongoPrazo"></div>
                  <div class="rentab-card-chart" id="rentabChartLongoPrazo"></div>
                  <div id="rentabLegendaLongoPrazo"></div>
                </div>
                <div class="card rentab-card">
                  <div class="rentab-card-info" id="rentabInfoNacional"></div>
                  <div class="rentab-card-chart" id="rentabChartNacional"></div>
                  <div id="rentabLegendaNacional"></div>
                </div>
                <div class="card rentab-card">
                  <div class="rentab-card-info" id="rentabInfoInternacional"></div>
                  <div class="rentab-card-chart" id="rentabChartInternacional"></div>
                  <div id="rentabLegendaInternacional"></div>
                </div>
                <div class="card rentab-card">
                  <div class="rentab-card-info" id="rentabInfoRendaEmergencial"></div>
                  <div class="rentab-card-chart" id="rentabChartRendaEmergencial"></div>
                  <div id="rentabLegendaRendaEmergencial"></div>
                </div>
              </div>
            </details>
          </div>

          <!-- 06/10/2026 (revisão do Tiago): Distribuição e Proventos lado a lado (50%/50%) logo abaixo da Rentabilidade, na área principal;
               a coluna da direita fica só com "Ativos". Os 4 cartões KPI de total por carteira saíram. -->
          <div class="home-dist-prov">
            <div id="resumoDistribuicao"></div>

            <!-- 24/09/2026: proventos do mês (inicio-proventos.js) -->
            <section class="card proventos-secao lateral-card" id="proventosSecao" hidden>
              <header class="card-cab lateral-cab">
                <div><span class="card-rotulo">Neste mês</span><h2 class="card-titulo">Proventos</h2></div>
                <a class="lateral-link btn btn-text btn-sm" href="proventos/index.html">Ver tudo</a>
              </header>
              <div class="prov-corpo"></div>
            </section>
          </div>
        </div>

        <aside class="home-lateral" aria-label="Metas e meus ativos">
          <!-- 07/10/2026: Metas no topo da coluna (inicio-metas.js; getMetas em paralelo, mesmo esquema do hero). No celular
               a coluna se desmancha e este cartão vem logo depois do hero (ordem em inicio.css). -->
          <section class="card lateral-card metas-home" id="metasHome" aria-label="Metas" data-estado="carregando">
            <div class="hm-esqueleto" aria-hidden="true"><span class="skel skel-linha hm-esq-a"></span><span class="skel skel-linha hm-esq-b"></span><span class="skel skel-linha hm-esq-b"></span><span class="skel skel-linha hm-esq-b"></span></div>
          </section>
          <section class="card lateral-card al-card" aria-label="Meus ativos">
            <header class="card-cab lateral-cab">
              <div><span class="card-rotulo" id="alContador"></span><h2 class="card-titulo">Meus ativos</h2></div>
            </header>
            <div class="al-ferramentas">
              <label class="al-busca"><span class="sr-only">Buscar ativo</span>
                <svg class="ico" aria-hidden="true"><use href="#ico-search"/></svg>
                <input type="search" class="input" id="alBusca" placeholder="Buscar ativo" autocomplete="off">
              </label>
              <label class="al-ordem"><span class="sr-only">Ordenar</span>
                <select class="select" id="alOrdem">
                  <option value="carteira">Carteira</option>
                  <option value="alta">Maior alta</option>
                  <option value="queda">Maior queda</option>
                  <option value="posicao">Maior posição</option>
                </select>
              </label>
            </div>
            <div class="al-abas" id="filtroAtivosTabs"></div>
            <ul class="al-lista lista-resumo" id="meusAtivosGrid"></ul>
            <button type="button" class="al-mais btn btn-text btn-sm" id="alMais" hidden></button>
          </section>
        </aside>
      </div>
    </div>
  </template>

<template id="page-distribuicoes-template">

    <!-- 14/09/2026: 1ª fatia foi só "Metas da Carteira". 2ª fatia (mesmo
         dia) acrescenta "Objetivos da Carteira" e a 4ª "Radar de
         oportunidades" (3ª foi só o back-end de leitura do Radar) — as
         seções vêm juntas na mesma ação distribuicoesMetas
         (apps-script/DistribuicoesMetas.gs), por isso compartilham
         loading/erro.
         06/10/2026 (Onda 3, kit Material 3): cabeçalho padrão (título + "Atualizar dados") e abas em pílula.
         06/10/2026 (Tiago): os objetivos da carteira viraram a meta "Distribuição da carteira" (Metas e Objetivos) e a aba
         Objetivos saiu: ficam DUAS abas - "Radar de oportunidades" (só a tabela de ativos) e "Metas" (todo o resumo: KPIs,
         distribuição da carteira e metas da carteira). Ver pages/distribuicoes-metas.js. -->

    <div id="metasCabecalho"></div>

    <div class="metas-loading" id="metasLoading" aria-hidden="true">
      <div class="grid-kpi"><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span><span class="skel skel-kpi"></span></div>
      <div class="obj-grid">
        <span class="skel skel-bloco"></span>
        <span class="skel skel-bloco"></span>
      </div>
    </div>

    <div class="metas-erro" id="metasErro" hidden></div>

    <div id="metasConteudo" hidden>
      <div class="avisos-banner" id="metasAvisos" hidden role="status"></div>

      <section class="dm-painel" id="painelRadar" data-painel="radar" aria-labelledby="tabRadar">
        <p class="dm-dica">Ranking de compra por classe de ativo. Toque no cabeçalho de uma coluna pra ordenar (padrão: Ranking) e em "Editar" numa linha pra mudar Ranking, Preço-teto ou % desejado direto na planilha.</p>
        <div id="splitInternoGrid"></div>
        <div id="radarOportunidadesGrid"></div>
      </section>

      <section class="dm-painel" id="painelMetas" data-painel="metas" aria-labelledby="tabMetas" hidden>
        <div class="grid-kpi dm-kpis" id="metasKpis"></div>
        <p class="dm-dica">Quanto você quer ter em cada tipo de ativo e quanto falta investir pra chegar lá (meta "Distribuição da carteira" - os pesos se editam em Metas e Objetivos), mais a Renda Passiva, o Patrimônio e a Renda Emergencial. Toque num cartão pra abrir a meta em Metas e Objetivos.</p>
        <div id="distribuicaoMetaGrid"></div>
        <div class="goals-grid" id="metasCarteiraGrid"></div>
      </section>
    </div>
  </template>
