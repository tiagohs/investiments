  assets/partials/shell.html — markup do shell compartilhado (top app bar + trilho de navegação + gaveta), buscado e
  injetado por assets/js/shell.js.

  Dois <template>, um por ponto de montagem que a página oferece:
    - #shell-header-template → clonado em <div id="shell-header"> (logo depois de abrir o .wrap, antes do <main>).
    - #shell-footer-template → clonado em <div id="shell-footer"> (depois do </main>, ainda dentro do .wrap).

  <template> é inerte até o shell.js clonar - este arquivo é dado, não uma página viva.

  05/10/2026 (Onda 3, pedido do Tiago: "navegação estilo Google, com navigation drawer recolhível ... menus internos
  (submenus) no topo"; padrão do kit Figma "Material You"): TRILHO de ícones de 80px (#mainnav, sempre visível >= 840px,
  com o ☰ no topo) + GAVETA de 280px (#navDrawer) que abre AO LADO do trilho (>= 1200px empurra o conteúdo, 840-1199px
  abre por cima com scrim) e, no celular (< 840px), é MODAL com scrim, aberta pelo ☰ da top bar. Top bar: marca + busca
  em pílula (ativos da carteira em cache + nomes de telas) + ações (carrinho em pílula preenchida, sync, tema, avatar).
  Submenus internos NÃO moram aqui: cada página os monta como abas (assets/js/ui/tabs.js).
  Contrato que continua valendo: #mainnav .nav-item[data-section] > a.nav-link (e o mesmo na gaveta), .current/.active
  na seção atual, #shell-backdrop, .overlay-panel[.open], [data-toggle-panel].

  O sprite de ícones (Material Symbols Rounded, scripts/gerar-sprite-icones.mjs) mora no template do header: toda
  página que monta o shell já tem todos os <use href="#ico-..."> à mão. Ids antigos (ico-check/warn/bad/cart/chev-r/
  chart/building/globe/wallet/coins) foram mantidos.
