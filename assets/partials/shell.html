<!--
  assets/partials/shell.html — markup for the shared UI shell (topbar +
  main nav + theme toggle), fetched and injected by assets/js/shell.js.

  Two <template> elements, one per mount point a page provides:
    - #shell-header-template → cloned into <div id="shell-header">,
      placed right after the page opens its .wrap, before <main>.
    - #shell-footer-template → cloned into <div id="shell-footer">,
      placed right after </main>, still inside .wrap.

  <template> content is inert (not rendered, scripts don't run, ids
  inside it don't collide with the page) until shell.js clones it in,
  which is exactly what we want — this file is data, not a live page.

  The icon sprite lives in the header template so every page that
  mounts the shell also gets every <use href="#ico-...")> icon the
  shell itself needs (sync/period popover, nav) for free. Page-specific
  content (e.g. a section's own .side-nav) reuses the same ids/symbols
  and can assume this sprite is already in the document once the shell
  is mounted.
-->
<template id="shell-header-template">
  <svg style="position:absolute; width:0; height:0; overflow:hidden" aria-hidden="true">
    <symbol id="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="ico-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6.4"/><path d="M12 17.3v.01"/></symbol>
    <symbol id="ico-bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="ico-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="ico-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M4 19h16"/></symbol>
    <symbol id="ico-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></symbol>
    <symbol id="ico-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.7 5.3 3.7 8.5s-1.3 6.2-3.7 8.5c-2.4-2.3-3.7-5.3-3.7-8.5S9.6 5.8 12 3.5Z"/></symbol>
    <symbol id="ico-percent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><circle cx="7" cy="7" r="2.3"/><circle cx="17" cy="17" r="2.3"/></symbol>
    <symbol id="ico-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></symbol>
    <symbol id="ico-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-4a2.2 2.2 0 0 1 0-4h4a1 1 0 0 1 1 1"/></symbol>
    <symbol id="ico-coins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><ellipse cx="15" cy="12" rx="6" ry="3"/></symbol>
  </svg>

  <div class="overlay-backdrop" id="shell-backdrop"></div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text"><h1>Patrimônio</h1><span>carteira pessoal · B3 + EUA</span></div>
    </div>
    <div class="topbar-right">
      <div class="refresh-pill" id="refreshPill" title="Cotações atualizadas há --">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15.3-6.3M21 12a9 9 0 0 1-15.3 6.3"/><path d="M18 3v5h-5M6 21v-5h5"/></svg>
        <span id="refreshLabel">--</span>
      </div>

      <div class="sync-wrap">
        <button class="sync-badge" id="syncBadgeBtn" type="button" aria-expanded="false" aria-haspopup="true"
                data-toggle-panel="syncPanel" title="Sincronização: aguardando primeira verificação">
          <svg><use href="#ico-check"/></svg>
        </button>
        <div class="overlay-panel" id="syncPanel">
          <div class="sync-panel-head">
            <h3>Registro de Controle</h3>
            <button class="btn btn-primary" id="syncNowBtn" type="button" style="padding:6px 12px; font-size:11.5px">Sincronizar agora</button>
          </div>
          <div class="sync-log" id="syncLog">
            <div class="hint" style="padding:9px 4px">Nenhuma sincronização registrada ainda.</div>
          </div>
          <div class="hint">O ícone mostra a cor do último status — o detalhe fica aqui dentro.</div>
        </div>
      </div>

      <div class="period-wrap">
        <button class="period-btn" id="periodBtn" type="button" aria-expanded="false" aria-haspopup="true"
                data-toggle-panel="periodPanel">
          <svg class="cal" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
          <span id="periodLabel">30 dias</span><span class="range" id="periodRange"></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6-6 6"/></svg>
        </button>
        <div class="overlay-panel" id="periodPanel">
          <button class="preset-item active" type="button" data-period="30d">30 dias</button>
          <button class="preset-item" type="button" data-period="12m">12 meses</button>
          <button class="preset-item" type="button" data-period="month">Mês atual</button>
          <button class="preset-item" type="button" data-period="year">Ano atual</button>
          <button class="preset-item" type="button" data-period="prev-month">Mês anterior</button>
          <button class="preset-item" type="button" data-period="prev-year">Ano anterior</button>
          <button class="preset-item" type="button" data-period="all">Desde o início</button>
          <button class="preset-item" type="button" data-period="custom">Personalizado…</button>
          <div class="custom-dates" id="customDates" style="display:none">
            <input type="date" id="customDateStart">
            <input type="date" id="customDateEnd">
          </div>
          <button class="apply-btn" id="periodApplyBtn" type="button">Aplicar</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="mainnav" id="mainnav">
    <div class="nav-item" data-section="inicio">
      <a class="nav-link" href="index.html" title="Início" data-section="inicio">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="nav-label">Início</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
    <div class="nav-item" data-section="distribuicoes">
      <a class="nav-link" href="distribuicoes-metas.html" title="Distribuições e Metas" data-section="distribuicoes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="nav-label">Distribuições e Metas</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
    <div class="nav-item" data-section="carteiras">
      <a class="nav-link" href="carteiras/index.html" title="Carteiras" data-section="carteiras">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
        <span class="nav-label">Carteiras</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
    <div class="nav-item" data-section="transacoes">
      <a class="nav-link" href="transacoes/compras.html" title="Transações" data-section="transacoes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M17 8l-3-3M17 8l-3 3"/><path d="M20 16H7M7 16l3-3M7 16l3 3"/></svg>
        <span class="nav-label">Transações</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
    <div class="nav-item" data-section="proventos">
      <a class="nav-link" href="proventos/nacionais.html" title="Proventos" data-section="proventos">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.3 9.6c0-1.1 1-1.9 2.7-1.9s2.7.8 2.7 1.8c0 2.4-5.4 1.4-5.4 3.9 0 1 1 1.8 2.7 1.8s2.7-.7 2.7-1.7"/></svg>
        <span class="nav-label">Proventos</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
    <div class="nav-item" data-section="organizacao">
      <a class="nav-link" href="organizacao/despesas.html" title="Organização Financeira" data-section="organizacao">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 0 1 1 1v15l-2-1-2 1-2-1-2 1-2-1-2 1-2-1V5a1 1 0 0 1 1-1Z"/><path d="M8.5 9h7M8.5 12h7M8.5 15h4"/></svg>
        <span class="nav-label">Organização Financeira</span>
      </a>
      <span class="nav-active-bar"></span>
    </div>
  </nav>
</template>

<template id="shell-footer-template">
  <div class="theme-footer">
    <button class="theme-fab" id="themeToggle" type="button" title="Alternar tema claro/escuro">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      <span class="txt"></span>
    </button>
  </div>
</template>
