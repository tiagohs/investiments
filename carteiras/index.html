<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- 05/10/2026 (A-44): Content-Security-Policy. Os hashes são do script inline desta página (tests/csp-html.test.js confere; ao editar o script, atualize o hash). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ijIUMfYK93Z5REBvtLdNEnkcoC2NnNpxkoBbDBVgEoY=' 'unsafe-hashes' 'sha256-9f8ZK5epjuMsYtXFjPqrgJI0L4QOAUYmJdHtT+RSH/c=' 'sha256-y3P6wGJnOuIb0bQXUstghuoCK7JMZT+3mX8f5qa7MxY=' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://nominatim.openstreetmap.org https://api.bcb.gov.br; frame-src https://www.youtube-nocookie.com https://drive.google.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carteiras · Patrimônio</title>

<!-- Blocinho PWA — colado em toda página HTML (item 8j do plano). -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&family=Roboto+Mono:wght@400..600&display=swap">
<!-- 05/10/2026: base Material 3 (kit Figma): tokens -> shell (top bar + trilho/gaveta) -> componentes; os CSS de página vêm depois -->
<link rel="stylesheet" href="../assets/css/m3-tokens.css">
<link rel="stylesheet" href="../assets/css/shell.css">
<link rel="stylesheet" href="../assets/css/components.css">
<!-- 06/10/2026 (Onda 3, fase 2): a tela usa a base M3 + charts.css (biblioteca de gráficos) + componentes-grafico.css ("Escolher período" e card de
     Análise) + carteiras.css (o metas.css do card da meta de renda passiva entra sozinho, via metas-card.js); inicio.css saiu (os gráficos/anel agora são de assets/js/charts) -->
<link rel="stylesheet" href="../assets/css/charts.css">
<link rel="stylesheet" href="../assets/css/componentes-grafico.css">
<link rel="stylesheet" href="../assets/css/carteiras.css">
</head>
<body data-section="carteiras">

<div class="wrap">
  <div id="shell-header"></div>

  <main class="cart-main">
    <!-- 06/10/2026 (Onda 3): cabeçalho padrão (título, subtítulo, abas em pílula no lugar do submenu lateral, "Atualizar dados" e
         "Adicionar ativo") montado por carteiras-router.js. Troca de aba = só mostrar/esconder <section> (sem reload). -->
    <header id="carteirasCabecalho"></header>

    <!-- ===================== Visão geral ===================== -->
    <section id="page-visao-geral" class="carteiras-page" data-page="visao-geral">
      <div class="cart-esq" id="vgLoading" aria-hidden="true">
        <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel cart-esq-bloco"></span>
      </div>
      <div id="vgErro" hidden></div>

      <div id="vgConteudo" hidden>
        <div id="vgAvisos" class="avisos-banner" role="status" hidden></div>
        <div id="vgResumo"></div>
        <div id="vgBenchmarks" class="cc-benchmarks"></div>
        <div class="vg-topo">
          <section class="card vg-composicao" aria-labelledby="vgComposicaoTitulo">
            <div class="cc-secao-cab"><h2 id="vgComposicaoTitulo">Composição</h2></div>
            <div id="vgDonut" class="cc-distribuicao"></div>
          </section>
          <div class="vg-cards" id="vgCardsGrid"></div>
        </div>
        <div id="vgGraficos" class="cc-graficos"></div>
        <!-- 02/10/2026: meta de renda passiva (assets/js/metas-card.js), carregada em paralelo; sem meta, só um convite discreto -->
        <div id="vgMetaRenda" class="vg-meta-renda" hidden></div>
        <!-- 25/09/2026: proventos do mês de todas as carteiras (carteiras-proventos.js) -->
        <div id="vgProventosWrap"></div>
      </div>
    </section>

    <!-- ===================== Ações ===================== -->
    <section id="page-acoes" class="carteiras-page" data-page="acoes" hidden>
      <div class="cart-esq" id="acoesLoading" aria-hidden="true">
        <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel cart-esq-bloco"></span>
      </div>
      <div id="acoesErro" hidden></div>
      <div id="acoesConteudo" hidden></div>
    </section>

    <!-- ===================== FIIs ===================== -->
    <section id="page-fiis" class="carteiras-page" data-page="fiis" hidden>
      <div class="cart-esq" id="fiisLoading" aria-hidden="true">
        <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel cart-esq-bloco"></span>
      </div>
      <div id="fiisErro" hidden></div>
      <div id="fiisConteudo" hidden></div>
    </section>

    <!-- ===================== Ações Internacionais ===================== -->
    <section id="page-acoes-eua" class="carteiras-page" data-page="acoes-eua" hidden>
      <div class="cart-esq" id="acoesEuaLoading" aria-hidden="true">
        <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel cart-esq-bloco"></span>
      </div>
      <div id="acoesEuaErro" hidden></div>
      <div id="acoesEuaConteudo" hidden></div>
    </section>

    <!-- ===================== Renda Fixa ===================== -->
    <section id="page-renda-fixa" class="carteiras-page" data-page="renda-fixa" hidden>
      <div class="cart-esq" id="rendaFixaLoading" aria-hidden="true">
        <div class="cart-esq-kpis"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel cart-esq-bloco"></span>
      </div>
      <div id="rendaFixaErro" hidden></div>
      <div id="rendaFixaConteudo" hidden></div>
    </section>
  </main>

  <div id="shell-footer"></div>
</div>

<script type="module">
  import { mountShell, limparCacheLocalNavegador } from '../assets/js/shell.js';
  import { mountCarteirasRouter } from '../assets/js/carteiras-router.js';
  import { ligarNovoAtivo, CLASSE_DA_PAGINA } from '../assets/js/pages/novo-ativo.js';

  mountShell({
    onAuthenticated(token) {
      mountCarteirasRouter(document, { token });
      ligarNovoAtivo(document, {
        token,
        // a aba aberta (abas em pílula do cabeçalho) diz em qual carteira o ativo novo entra
        classeAtual: () => CLASSE_DA_PAGINA[(document.querySelector('.pagina-abas [data-tab][aria-selected="true"]') || {}).dataset?.tab] || '',
        async aoFechar({ cadastrou }) {
          if (!cadastrou) return;
          await limparCacheLocalNavegador();
          window.location.reload();
        },
      });
    },
  });
</script>
</body>
</html>
