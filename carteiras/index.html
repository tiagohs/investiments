<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteiras</title>

<!-- Blocinho PWA — colado em toda página HTML (item 8j do plano). -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2A78D6">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/shell.css">
<!-- 19/09/2026: inicio.css entra aqui só pelas classes que Carteiras
     REAPROVEITA de lá — renderDistribuicao (.distrib-*) e
     renderGraficoRentabilidade/wireGraficoRentabilidade (.rentab-*,
     .chart-legend2, .filter-tabs já vem de shell.css) — ver
     assets/js/pages/carteiras-visao-geral.js. Mesmo padrão do
     comentário em index.html sobre folhas compartilhadas entre
     páginas. carteiras.css tem só o que é NOVO desta seção (sidebar
     de contexto usa .side-nav/.section-content, já em shell.css). -->
<link rel="stylesheet" href="../assets/css/inicio.css">
<link rel="stylesheet" href="../assets/css/carteiras.css">
</head>
<body data-section="carteiras">

<div class="wrap">
  <div id="shell-header"></div>

  <div class="section-layout">
    <!-- 19/09/2026: sidebar de contexto de Carteiras — reaproveita
         .side-nav/.side-item/.side-ico/.side-label de shell.css (item
         reservado desde 17/09/2026 pras seções com subpáginas). Cada
         item colore seu .side-ico com a cor da classe de ativo
         correspondente via --accent/--accent-soft inline, exatamente
         como o comentário de shell.css descreve. Troca de página é só
         mostrar/esconder <section> (ver carteiras-router.js) — sem
         reload, mesma técnica de router.js pra Início/Distribuições. -->
    <nav class="side-nav" id="carteirasSideNav" aria-label="Navegação de Carteiras">
      <span class="eyebrow" style="padding:2px 12px 4px">Carteiras</span>

      <button class="side-item active" type="button" data-page="visao-geral"
              style="--accent:var(--ink); --accent-soft:var(--surface-3)">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="side-label">Visão geral</span>
      </button>

      <button class="side-item" type="button" data-page="acoes"
              style="--accent:var(--acoes); --accent-soft:var(--acoes-soft)">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M4 19h16"/></svg></span>
        <span class="side-label">Ações</span>
      </button>

      <button class="side-item" type="button" data-page="fiis"
              style="--accent:var(--fiis); --accent-soft:var(--fiis-soft)">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></svg></span>
        <span class="side-label">FIIs</span>
      </button>

      <button class="side-item" type="button" data-page="acoes-eua"
              style="--accent:var(--usa); --accent-soft:var(--usa-soft)">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.7 5.3 3.7 8.5s-1.3 6.2-3.7 8.5c-2.4-2.3-3.7-5.3-3.7-8.5S9.6 5.8 12 3.5Z"/></svg></span>
        <span class="side-label">Ações Internacionais</span>
      </button>

      <button class="side-item" type="button" data-page="renda-fixa"
              style="--accent:var(--rf); --accent-soft:var(--rf-soft)">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><ellipse cx="15" cy="12" rx="6" ry="3"/></svg></span>
        <span class="side-label">Renda Fixa</span>
      </button>
    </nav>

    <div class="section-content">
      <h2 class="carteiras-mobile-title" id="carteirasMobileTitle">Visão geral</h2>

      <!-- ===================== Visão geral ===================== -->
      <section id="page-visao-geral" class="carteiras-page" data-page="visao-geral">
        <div class="carteiras-loading" id="vgLoading" aria-hidden="true">
          <span class="skel skel-header"></span>
          <span class="skel" style="height:150px;border-radius:16px"></span>
          <span class="skel skel-header" style="margin-top:10px"></span>
          <span class="skel" style="height:190px;border-radius:16px"></span>
        </div>
        <div class="carteiras-erro" id="vgErro" hidden></div>

        <div id="vgConteudo" hidden>
          <div id="refreshControlVisaoGeral" class="refresh-control"></div>
          <div class="avisos-banner" id="vgAvisos" hidden></div>

          <!-- 19/09/2026: 2 cartões separados (era 1 só, ver comentário em
               carteiras.css) - o da esquerda ganhou o resumo
               Investido/Lucro-Prejuízo/Rentabilidade + benchmarks
               (vs Ibovespa/CDI) que faltava (renderHeroStats_/
               renderBenchmarksClasseCarteiras em carteiras-visao-geral.js). -->
          <div class="cg-hero-grid">
            <div class="cg-hero-card">
              <span class="eyebrow">Patrimônio em carteiras</span>
              <div class="cg-hero-valor" id="vgPatrimonioTotal">—</div>
              <div class="cg-hero-stats" id="vgResumo"></div>
              <div id="vgBenchmarks" class="cc-benchmarks"></div>
            </div>
            <div class="cg-hero-card cg-hero-donut" id="vgDonut"></div>
          </div>

          <!-- 19/09/2026: filtro de período sobe pro topo do 1º gráfico
               (Evolução) - mesmo padrão da Início (#periodoTabs sempre no
               topo do 1º gráfico da seção, afeta todos abaixo dele: aqui
               afeta Evolução E Rentabilidade acumulada). Antes ficava
               entre os 2 gráficos, meio "pendurado" sem dono claro -
               Tiago reportou. -->
          <div class="area-header" style="margin-top:24px">
            <h2>Evolução do patrimônio</h2>
            <span class="hint">quanto você tem vs. quanto investiu, dia a dia</span>
          </div>
          <div class="filter-tabs" id="vgPeriodoTabs" style="margin-bottom:12px">
            <button class="filter-tab active" type="button" data-periodo="mes">Mês atual</button>
            <button class="filter-tab" type="button" data-periodo="30d">30 dias</button>
            <button class="filter-tab" type="button" data-periodo="6m">6 meses</button>
            <button class="filter-tab" type="button" data-periodo="12m">12 meses</button>
            <button class="filter-tab" type="button" data-periodo="3a">3 anos</button>
            <button class="filter-tab" type="button" data-periodo="tudo">Desde o início</button>
          </div>
          <div class="cg-chart-card">
            <div class="rentab-card-info" id="vgInfoEvolucao"></div>
            <div id="vgEvolucaoChart"></div>
            <div class="chart-legend2" id="vgEvolucaoLegenda"></div>
          </div>

          <!-- vgInfoRentabilidade morava dentro do hero acima (duplicava o
               "Patrimônio total" que já aparece lá - Tiago reportou) - o
               lugar certo dele é aqui, junto do próprio gráfico que ele
               descreve (mesmo padrão de .rentab-card-info+.rentab-card-chart
               na Início, sempre juntos no mesmo cartão). -->
          <div class="area-header" style="margin-top:22px">
            <h2>Rentabilidade acumulada</h2>
          </div>
          <div class="cg-chart-card">
            <div class="rentab-card-info" id="vgInfoRentabilidade"></div>
            <div id="vgRentabChart"></div>
            <div class="chart-legend2" id="vgRentabLegenda"></div>
          </div>

          <div class="area-header" style="margin-top:22px">
            <h2>Carteiras</h2>
            <span class="hint">clique num item do menu ao lado pra ver o detalhe de cada uma</span>
          </div>
          <div class="cg-cards-grid" id="vgCardsGrid"></div>
          <!-- 25/09/2026: proventos do mês de todas as carteiras (carteiras-proventos.js) -->
          <div id="vgProventosWrap"></div>
        </div>
      </section>

      <!-- ===================== Ações ===================== -->
      <section id="page-acoes" class="carteiras-page" data-page="acoes" hidden>
        <div class="carteiras-loading" id="acoesLoading" aria-hidden="true">
          <span class="skel skel-header"></span>
          <div class="cc-skel-tiles"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
          <span class="skel" style="height:220px;border-radius:16px;margin-top:8px"></span>
        </div>
        <div class="carteiras-erro" id="acoesErro" hidden></div>
        <div id="refreshControlAcoes" class="refresh-control"></div>
        <div id="acoesConteudo" hidden></div>
      </section>

      <!-- ===================== FIIs ===================== -->
      <section id="page-fiis" class="carteiras-page" data-page="fiis" hidden>
        <div class="carteiras-loading" id="fiisLoading" aria-hidden="true">
          <span class="skel skel-header"></span>
          <div class="cc-skel-tiles"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
          <span class="skel" style="height:220px;border-radius:16px;margin-top:8px"></span>
        </div>
        <div class="carteiras-erro" id="fiisErro" hidden></div>
        <div id="refreshControlFiis" class="refresh-control"></div>
        <div id="fiisConteudo" hidden></div>
      </section>

      <!-- ===================== Ações Internacionais ===================== -->
      <section id="page-acoes-eua" class="carteiras-page" data-page="acoes-eua" hidden>
        <div class="carteiras-loading" id="acoesEuaLoading" aria-hidden="true">
          <span class="skel skel-header"></span>
          <div class="cc-skel-tiles"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
          <span class="skel" style="height:220px;border-radius:16px;margin-top:8px"></span>
        </div>
        <div class="carteiras-erro" id="acoesEuaErro" hidden></div>
        <div id="refreshControlAcoesEua" class="refresh-control"></div>
        <div id="acoesEuaConteudo" hidden></div>
      </section>

      <!-- ===================== Renda Fixa ===================== -->
      <section id="page-renda-fixa" class="carteiras-page" data-page="renda-fixa" hidden>
        <div class="carteiras-loading" id="rendaFixaLoading" aria-hidden="true">
          <span class="skel skel-header"></span>
          <div class="cc-skel-tiles"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
          <span class="skel" style="height:220px;border-radius:16px;margin-top:8px"></span>
        </div>
        <div class="carteiras-erro" id="rendaFixaErro" hidden></div>
        <div id="refreshControlRendaFixa" class="refresh-control"></div>
        <div id="rendaFixaConteudo" hidden></div>
      </section>
    </div>
  </div>

  <div id="shell-footer"></div>
</div>

<script type="module">
  import { mountShell } from '../assets/js/shell.js';
  import { mountCarteirasRouter } from '../assets/js/carteiras-router.js';

  mountShell({
    onAuthenticated(token) {
      mountCarteirasRouter(document, { token });
    },
  });
</script>
</body>
</html>
