<link rel="stylesheet" href="../assets/css/m3-tokens.css">
<link rel="stylesheet" href="../assets/css/shell.css">
<link rel="stylesheet" href="../assets/css/components.css">
<!-- 06/10/2026 (Onda 3): inicio.css e carteiras.css saíram (.skel, estados e chips vêm de components.css); charts.css = biblioteca de gráficos;
     organizacao.css tem só o que é desta tela. -->
<link rel="stylesheet" href="../assets/css/charts.css">
<link rel="stylesheet" href="../assets/css/organizacao.css">
<link rel="stylesheet" href="../assets/css/patrimonio.css">
<!-- 03/10/2026: peças das abas reorganizadas (gastos reais, simulador,
     seção Renda) e os componentes de filtro/análise dos gráficos -->
<link rel="stylesheet" href="../assets/css/gastos.css">
<link rel="stylesheet" href="../assets/css/simulador.css">
<link rel="stylesheet" href="../assets/css/renda.css">
<link rel="stylesheet" href="../assets/css/componentes-grafico.css">
</head>
<body data-section="organizacao">

<div class="wrap">
  <div id="shell-header"></div>

  <main class="og-pagina">
    <!-- 06/10/2026 (Onda 3): cabeçalho padrão (montarCabecalhoPagina), abas em pílula no topo (criarTabs) e Documentos recolhível;
         tudo montado por organizacao.js. Endereços antigos continuam: #patrimonio, #despesas, #salario (= Renda); novos: #gastos, #renda. -->
    <header id="ogCabecalho"></header>
    <nav id="ogAbas" aria-label="Organização Financeira"></nav>
    <section id="ogDocumentos" aria-label="Documentos"></section>
    <div id="painelPatrimonio" role="tabpanel" aria-labelledby="ogAbas-tab-patrimonio"><div id="patrimonioConteudo" class="pt-conteudo"></div></div>
    <div id="painelDespesas" role="tabpanel" aria-labelledby="ogAbas-tab-despesas" hidden>
      <div class="og-carregando" id="organizacaoLoading" aria-hidden="true">
        <div class="grid-kpi"><span class="skel"></span><span class="skel"></span><span class="skel"></span></div>
        <span class="skel skel-bloco og-skel-110"></span>
        <span class="skel skel-bloco og-skel-420"></span>
      </div>
      <div id="organizacaoErro" hidden></div>
      <div id="organizacaoConteudo" hidden></div>
      <div id="gastosConteudo" class="og-gastos"></div>
      <p class="og-link-sim"><a href="#simulacoes" class="pt-link">Simular amortizar × investir → Simulações</a></p>
    </div>
    <div id="painelRenda" role="tabpanel" aria-labelledby="ogAbas-tab-renda" hidden>
      <div class="pt-conteudo og-renda">
        <div id="rendaTopo"></div>
        <div id="carreiraFgts"></div>
        <div id="salarioConteudo" class="sl-conteudo"></div>
        <div id="rendaInvestimento"></div>
        <div id="rendaContas"></div>
      </div>
    </div>
    <div id="painelSimulacoes" role="tabpanel" aria-labelledby="ogAbas-tab-simulacoes" hidden>
      <div class="pt-conteudo og-simulacoes">
        <div id="simulacoesHero" aria-live="polite"></div>
        <div id="simulador" class="og-simulador"></div>
      </div>
    </div>
  </main>

  <div id="shell-footer"></div>
</div>
<script type="module">
  import { mountShell } from '../assets/js/shell.js';
  import { montarPaginaOrganizacao } from '../assets/js/pages/organizacao.js';
  mountShell({
    onAuthenticated(token) {
      montarPaginaOrganizacao(token, { doc: document });
    },
  });
</script>
</body>
</html>
