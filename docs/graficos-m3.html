<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de gráficos (M3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/m3-tokens.css">
<link rel="stylesheet" href="../assets/css/charts.css">
<link rel="stylesheet" href="graficos-m3.css">
</head>
<body>
<header class="cat-topo">
  <div class="cat-topo-in">
    <div>
      <h1>Catálogo de gráficos</h1>
      <p>Biblioteca única <code>assets/js/charts/</code> · dados inventados · fiel ao kit Figma, com animações M3</p>
    </div>
    <div class="cat-controles" role="group" aria-label="Controles do catálogo">
      <div class="chart-seg" role="group" aria-label="Tema" id="catTema"></div>
      <button type="button" class="cat-btn" id="catRepetir">Repetir animações</button>
    </div>
  </div>
</header>
<main class="cat-main" id="catMain"></main>
<script type="module" src="graficos-m3.js"></script>
</body>
</html>
