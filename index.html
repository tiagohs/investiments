<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrimônio</title>

<!-- Blocinho PWA — colado em toda página HTML (item 8j do plano). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2A78D6">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimônio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/inicio.css">
</head>
<body data-section="inicio">

<div class="wrap">
  <div id="shell-header"></div>

  <main hidden>
    <!-- Fase 2 / Parte 1 (13/09/2026): cards de Índices & Câmbio + hero
         de Patrimônio (3 visões). O gráfico de Rentabilidade (com
         seletor de período) e a grade "Meus Ativos" clicável são a
         próxima parte — ver docs/plano-implementacao.html, Fase 2. -->

    <!-- Skeleton de carregamento (13/09/2026) - placeholders no formato do
         conteúdo real (grade de índices/câmbio + hero de patrimônio) em vez
         de um spinner central genérico, pra reduzir o "salto" visual quando
         os dados chegam. Ver o bug de especificidade CSS documentado em
         inicio.css sobre [hidden] - a mesma regra vale aqui. -->
    <div class="inicio-loading" id="inicioLoading" aria-hidden="true">
      <span class="skel skel-header"></span>
      <div class="skel-grid">
        <span class="skel skel-tile"></span>
        <span class="skel skel-tile"></span>
        <span class="skel skel-tile"></span>
        <span class="skel skel-tile"></span>
        <span class="skel skel-tile"></span>
      </div>
      <span class="skel skel-header" style="margin-top:10px"></span>
      <span class="skel skel-hero"></span>
    </div>

    <div class="inicio-erro" id="inicioErro" hidden></div>

    <div id="inicioConteudo" hidden>
      <div class="avisos-banner" id="inicioAvisos" hidden></div>

      <div class="area-header">
        <h2>Índices &amp; câmbio</h2>
        <span class="hint">referência de mercado — não é dado da sua carteira</span>
      </div>
      <div class="widget-grid" id="indicesCambioGrid"></div>

      <div class="area-header">
        <h2>Minha carteira — situação atual</h2>
        <span class="personal-chip">🔒 Seus dados · aba Dash Geral</span>
      </div>
      <div class="filter-tabs" id="visaoTabs" style="margin-bottom:12px">
        <button class="filter-tab active" type="button" data-visao="total">Total</button>
        <button class="filter-tab" type="button" data-visao="longoPrazo">Longo Prazo</button>
        <button class="filter-tab" type="button" data-visao="rendaEmergencial">Renda Emergencial</button>
      </div>
      <div id="heroPatrimonio"></div>

      <div class="area-header" style="margin-top:26px">
        <h2>Rentabilidade</h2>
        <span class="hint">Total, Longo Prazo e Renda Emergencial - cada um contra seus benchmarks</span>
      </div>
      <div class="filter-tabs" id="periodoTabs" style="margin-bottom:14px">
        <button class="filter-tab" type="button" data-periodo="30d">30 dias</button>
        <button class="filter-tab" type="button" data-periodo="6m">6 meses</button>
        <button class="filter-tab active" type="button" data-periodo="12m">12 meses</button>
        <button class="filter-tab" type="button" data-periodo="3a">3 anos</button>
        <button class="filter-tab" type="button" data-periodo="tudo">Desde o início</button>
      </div>

      <div class="rentab-grid">
        <div class="rentab-card rentab-card-total">
          <div class="rentab-card-info" id="rentabInfoTotal"></div>
          <div class="rentab-card-chart" id="rentabChartTotal"></div>
          <div class="chart-legend2" id="rentabLegendaTotal"></div>
        </div>
        <div class="rentab-card">
          <div class="rentab-card-info" id="rentabInfoLongoPrazo"></div>
          <div class="rentab-card-chart" id="rentabChartLongoPrazo"></div>
          <div class="chart-legend2" id="rentabLegendaLongoPrazo"></div>
        </div>
        <div class="rentab-card">
          <div class="rentab-card-info" id="rentabInfoRendaEmergencial"></div>
          <div class="rentab-card-chart" id="rentabChartRendaEmergencial"></div>
          <div class="chart-legend2" id="rentabLegendaRendaEmergencial"></div>
        </div>
      </div>

      <div class="area-header" style="margin-top:26px">
        <h2>Meus ativos</h2>
        <span class="hint">cartão inteiro é o link pro Detalhe do Ativo</span>
      </div>
      <div class="filter-tabs" id="filtroAtivosTabs" style="margin-bottom:12px">
        <button class="filter-tab active" type="button" data-classe="todos">Todos</button>
        <button class="filter-tab" type="button" data-classe="acoes">Ações</button>
        <button class="filter-tab" type="button" data-classe="fiis">FIIs</button>
        <button class="filter-tab" type="button" data-classe="usa">Ações EUA</button>
        <button class="filter-tab" type="button" data-classe="rf">Renda Fixa</button>
      </div>
      <div class="ativos-grid" id="meusAtivosGrid"></div>
    </div>
  </main>

  <div id="shell-footer"></div>
</div>

<script type="module">
  import { mountShell } from './assets/js/shell.js';
  import { montarPaginaInicio } from './assets/js/pages/inicio.js';

  mountShell({
    onAuthenticated(token) {
      montarPaginaInicio(token);
    },
  });
</script>
</body>
</html>
